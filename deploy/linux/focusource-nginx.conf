# Port 80 only redirects. Do not proxy HTTP to Node: an application error
# must not turn http:// into a 500.
server {
    listen 80;
    listen [::]:80;
    server_name composite-strapping.com www.composite-strapping.com;
    return 301 https://www.composite-strapping.com$request_uri;
}

# Leave the ssl servers commented out until the certificate exists.
# A missing ssl_certificate makes nginx reject this whole file, including
# the port 80 redirect.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name composite-strapping.com;

    ssl_certificate /etc/letsencrypt/live/www.composite-strapping.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.composite-strapping.com/privkey.pem;

    return 301 https://www.composite-strapping.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.composite-strapping.com;

    ssl_certificate /etc/letsencrypt/live/www.composite-strapping.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.composite-strapping.com/privkey.pem;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
